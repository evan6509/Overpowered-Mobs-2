name: Fabric build and release

on:
  push:
    branches: [main, codex/development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep version selection and publication under the same lock.
concurrency:
  group: fabric-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'publish' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub requires push access to include draft releases in this listing.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          python3 scripts/release_version.py "$RUNNER_TEMP/releases.json"

  build:
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use selected release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SELECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf 'OPM_VERSION=%s\n' "$SELECTED_VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Fabric mod
        run: ./gradlew --no-daemon clean build

      - name: Verify installable JAR
        id: jar
        run: python3 scripts/verify_mod_jar.py

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mod
          path: ${{ steps.jar.outputs.jar }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      OPM_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: fabric-mod
          path: release

      - name: Verify downloaded JAR
        run: python3 scripts/verify_mod_jar.py release

      - name: Publish and verify release
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG points at a different commit." >&2
              exit 1
            fi
          fi
          # A failed API request must not be mistaken for a missing release.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          draft=$(jq -r --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | if length == 0 then "missing" else .[0].draft end' "$RUNNER_TEMP/releases.json")
          if [ "$draft" = false ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
            echo 'This commit is already published; keeping the existing release.'
            exit 0
          fi
          if [ "$draft" = true ] && ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            draft_target=$(jq -r --arg tag "$RELEASE_TAG" '.[][] | select(.tag_name == $tag) | .target_commitish' "$RUNNER_TEMP/releases.json")
            if [ "$draft_target" != "$GITHUB_SHA" ]; then
              echo "Draft $RELEASE_TAG does not target this exact commit." >&2
              exit 1
            fi
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          authored_notes=".github/release-notes/$RELEASE_TAG.md"
          if [ -f "$authored_notes" ]; then
            cp "$authored_notes" "$notes"
          else
            previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
            printf "# What's new in %s\n\n" "$OPM_VERSION" > "$notes"
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$GITHUB_SHA" --no-merges --pretty=format:'- %s' >> "$notes"
              printf '\n\n[Full changelog](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG" >> "$notes"
            else
              printf 'Initial automated Fabric release.\n' >> "$notes"
            fi
          fi
          jars=(release/*.jar)
          jar="${jars[0]}"
          python3 - "$jar" >> "$notes" <<'PY'
          import json
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as jar:
              depends = json.loads(jar.read('fabric.mod.json'))['depends']
          print('\nFabric only. Requirements: ' + ', '.join(
              f'{name} {depends[key]}' for key, name in (
                  ('minecraft', 'Minecraft'), ('fabricloader', 'Fabric Loader'),
                  ('fabric-api', 'Fabric API'), ('java', 'Java'))) + '.')
          PY
          if [ "$draft" = missing ]; then
            gh release create "$RELEASE_TAG" "$jar" --repo "$GITHUB_REPOSITORY" \
              --title "Overpowered Mobs $OPM_VERSION" --notes-file "$notes" --target "$GITHUB_SHA" --draft
          else
            gh release upload "$RELEASE_TAG" "$jar" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          fi
          # Publish only after checking that GitHub serves the exact built JAR.
          verification_dir=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$jar")" --dir "$verification_dir"
          cmp "$jar" "$verification_dir/$(basename "$jar")"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
