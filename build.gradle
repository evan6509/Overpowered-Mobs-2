plugins {
    id "maven-publish"
    id "net.fabricmc.fabric-loom" version "1.17.14"
}

def getGitCommitCount() {
    def process = "git rev-list --count HEAD".execute()
    process.waitFor()
    return process.text.trim()
}

version = project.mod_version + "+mc" + project.minecraft_version + "-b" + getGitCommitCount()
group = project.maven_group

def resourceModVersion = project.mod_version
def minecraftDependency = project.minecraft_dependency
def archiveBaseName = project.archives_base_name
def testServerModsDir = providers.gradleProperty("testServerModsDir")

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", resourceModVersion
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": resourceModVersion,
               "minecraft_dependency": minecraftDependency
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${archiveBaseName}" }
    }
}

tasks.register("deployToTestServer") {
    group = "deployment"
    description = "Builds and copies the mod JAR to -PtestServerModsDir=<path>"
    dependsOn tasks.named("jar")

    doLast {
        String configuredDir = testServerModsDir.orNull
        if (configuredDir == null || configuredDir.isBlank()) {
            throw new GradleException("Set -PtestServerModsDir=<path> to deploy the mod")
        }

        File jarFile = tasks.named("jar").get().archiveFile.get().asFile
        File modsDir = new File(configuredDir)
        java.nio.file.Files.createDirectories(modsDir.toPath())
        modsDir.listFiles()
            ?.findAll { it.name.startsWith("overpoweredmobs-") && it.name != jarFile.name }
            ?.each { java.nio.file.Files.deleteIfExists(it.toPath()) }
        java.nio.file.Files.copy(
            jarFile.toPath(),
            modsDir.toPath().resolve(jarFile.name),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
